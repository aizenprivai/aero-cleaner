[package]
name = "aero-cleaner"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Frutiger Aero style system cleaner for Linux Mint"

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
# Bundled emoji icons, so the UI looks the same on every system (Windows has no Noto emoji).
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }

[profile.dist]
# Used for packaging (`cargo build --profile dist`): stripped, whole-program
# optimized. Halves the binary size but takes several minutes to build.
inherits = "release"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry"] }
winreg = "0.55"
trash = "5"

[build-dependencies]
winresource = "0.1.34"
