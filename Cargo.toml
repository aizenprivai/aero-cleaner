[package]
name = "aero-cleaner"
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aizenprivai/aero-cleaner"
description = "Frutiger Aero style system cleaner for Linux, Windows and macOS"

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
# Bundled emoji icons, so the UI looks the same on every system (Windows has no Noto emoji).
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
# Firefox history lives in the same SQLite file as bookmarks. Bundled, so no
# system library is needed on any OS.
rusqlite = { version = "0.42", features = ["bundled"] }
# Parallel folder walking and hashing for Big files, Duplicates and Disk map.
rayon = "1"
blake3 = "1"
# Decoding photos for "similar photos" (perceptual hashes).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Reading GitHub release information and checking downloads in the updater.
serde_json = "1"
sha2 = "0.10"

[profile.dist]
# Used for packaging (`cargo build --profile dist`): stripped, whole-program
# optimized. Halves the binary size but takes several minutes to build.
inherits = "release"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Console"] }
winreg = "0.55"
trash = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# Talking to the privileged helper (and serving it) on the system bus.
zbus = "5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Tests talk to the helper over a private socket pair.
zbus = { version = "5", features = ["p2p"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Moves files to the Trash through Finder, so "Put Back" works.
trash = "5"

[build-dependencies]
winresource = "0.1.34"

[lints.clippy]
# UI drawing helpers take many small parameters, and channel payloads are
# tuples; splitting them up wouldn't make the code clearer.
too_many_arguments = "allow"
type_complexity = "allow"

[dev-dependencies]
# Drives the real app headlessly in tests (no window, no GPU).
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
