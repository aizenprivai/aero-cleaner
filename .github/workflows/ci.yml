name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # "Run workflow" on GitHub builds every package without publishing a release.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: APT repository script (end to end, with a throwaway key)
        run: sudo apt-get install -y apt-utils && packaging/apt/test-repo.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Run tests
        # Debug build on purpose: integer overflow checks are on.
        run: cargo test

  # The same tests on other Linux distributions (package manager detection,
  # their cleaning scripts), inside each distro's own container.
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            deps: dnf -y install gcc pkgconf-pkg-config libxkbcommon-devel wayland-devel mesa-libGL-devel findutils which curl git
          - name: arch
            image: archlinux:latest
            deps: pacman -Syu --noconfirm base-devel libxkbcommon wayland mesa findutils which curl git
          - name: opensuse
            image: opensuse/tumbleweed:latest
            deps: zypper -n install rust cargo gcc pkg-config libxkbcommon-devel wayland-devel Mesa-libGL-devel findutils which curl git tar gzip
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v7
      # openSUSE ships current Rust itself; rustup refuses its container's home folder.
      - if: matrix.name != 'opensuse'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  # The jobs below only run for a version tag (e.g. v1.1.0).
  build-linux:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev librsvg2-bin rpm
      - name: Build .deb
        run: |
          git config user.name "AeroClean"
          git config user.email "noreply@github.com"
          packaging/build-deb.sh
      - name: Build .rpm
        run: |
          packaging/build-rpm.sh
          rpm -qlp target/rpm/*.rpm
      - name: Build AppImage
        run: |
          packaging/build-appimage.sh
          # Smoke test: the AppImage starts and prints its help.
          target/appimage/*.AppImage --appimage-extract-and-run --help | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/deb/*.deb
            target/rpm/*.rpm
            target/appimage/*.AppImage

  build-windows:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # Optional code signing (see README "Signing releases"). Without these
      # secrets the .exe and installer are built unsigned.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build .exe
        run: cargo build --profile dist
      - name: Prepare signing
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Sign AeroClean.exe
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: '& $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 target/dist/aero-cleaner.exe'
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DVersion=$version" "/DSource=$PWD\target\dist\aero-cleaner.exe" "/O$PWD\dist" packaging\windows\aeroclean.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          Get-ChildItem dist\*-setup.exe | ForEach-Object { & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Installer test (silent install, as winget runs it)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # winget finds the installed app by this uninstall entry (ProductCode in the manifest).
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B3E3C1A-7A43-4E0B-9C61-AE20C1EA0001}_is1'
          if (-not (Test-Path $key)) { throw "uninstall entry missing: $key" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\AeroClean\AeroClean.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\AeroClean') -Filter *.exe -Recurse | Select-Object -First 1 }
          if (-not $exe) { throw "AeroClean wasn't installed" }
          (Get-ItemProperty $key).DisplayName
          $uninstall = (Get-ItemProperty $key).UninstallString.Trim('"')
          Start-Process $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Package portable .zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "AeroClean-$version-windows-x64-portable"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/dist/aero-cleaner.exe "dist/$name/AeroClean.exe"
          Copy-Item LICENSE "dist/$name/LICENSE.txt"
          @"
          AeroClean $version for Windows 10 and 11 (portable)

          Double-click AeroClean.exe. No installation needed; on first launch it adds itself to the Start Menu.
          Prefer the installer (AeroClean-$version-windows-setup.exe) if you want an uninstaller.
          Cleaning system items asks for administrator permission once per clean.

          https://github.com/${{ github.repository }}  -  MIT License
          "@ | Set-Content "dist/$name/README.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  build-macos:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # Optional Developer ID signing and notarization (see README "Signing
      # releases"). Without these secrets the app is signed ad hoc.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build AeroClean.dmg
        run: packaging/build-macos.sh
      - name: Homebrew cask test (style, install from the .dmg, uninstall)
        run: |
          dmg=$(ls target/macos/*.dmg | head -1)
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          brew tap-new --no-git aeroclean/test
          tap="$(brew --repository)/Library/Taps/aeroclean/homebrew-test"
          mkdir -p "$tap/Casks"
          CASK_URL="file://$PWD/$dmg" packaging/homebrew/make-cask.sh "$version" "$dmg" > "$tap/Casks/aeroclean.rb"
          brew style "$tap/Casks/aeroclean.rb"
          brew install --cask aeroclean/test/aeroclean
          test -d /Applications/AeroClean.app
          brew uninstall --cask aeroclean/test/aeroclean
          brew untap aeroclean/test
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/macos/*.dmg

  publish:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Packages from one artifact can sit in subfolders (deb/, rpm/...): bring them up.
          find assets -mindepth 2 -type f -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          # AUR recipe for this release, with the source archive's checksum.
          tag="${{ github.ref_name }}"
          curl -fsSL -o src.tar.gz "https://github.com/${{ github.repository }}/archive/refs/tags/$tag.tar.gz"
          sed -e "s/@VERSION@/${tag#v}/" -e "s/@SHA256@/$(sha256sum src.tar.gz | cut -d' ' -f1)/" packaging/aur/PKGBUILD.in > assets/PKGBUILD
          # Ready-made winget manifests and Homebrew cask for this release.
          ver="${tag#v}"
          packaging/winget/make-manifests.sh "$ver" "assets/AeroClean-$ver-windows-setup.exe" winget >/dev/null
          cp winget/manifests/a/AeroClean/AeroClean/"$ver"/*.yaml assets/
          packaging/homebrew/make-cask.sh "$ver" "assets/AeroClean-$ver-macos.dmg" > assets/aeroclean.rb
          (cd assets && sha256sum * > SHA256SUMS)
          # Notes: this version's section of ROADMAP.md ("**v1.6 – ...**" up to the next blank line).
          tag="${{ github.ref_name }}"; ver="${tag#v}"; short="${ver%.*}"
          awk -v h="**v$short " 'index($0, h) == 1 {f = 1} f && /^$/ {exit} f' ROADMAP.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$tag" assets/* --repo "${{ github.repository }}" --title "AeroClean $tag" "${notes[@]}"

  # Adds the release's .deb to the signed APT repository on GitHub Pages
  # (https://<owner>.github.io/aero-cleaner/apt). Needs the APT_SIGNING_KEY
  # secret (an armored private key without passphrase); skipped without it.
  apt-repo:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::No APT_SIGNING_KEY secret: the APT repository isn't updated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux
      - name: Update the repository
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get install -y apt-utils
          export GNUPGHOME=$(mktemp -d)
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          export APT_KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          export APT_REPO_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/apt"
          # The site lives on the gh-pages branch (made on the first run).
          git config user.name "AeroClean"
          git config user.email "noreply@github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add site origin/gh-pages
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi
          touch site/.nojekyll
          packaging/apt/update-repo.sh site/apt $(find linux -name '*.deb')
          git -C site add -A
          git -C site commit -qm "APT repository: ${GITHUB_REF_NAME}"
          git -C site push origin gh-pages
