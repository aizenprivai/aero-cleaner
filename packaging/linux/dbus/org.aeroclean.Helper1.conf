<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- AeroClean's helper: only root may own the name; anyone may call it,
     and every operation is then checked with polkit. -->
<busconfig>
  <policy user="root">
    <allow own="org.aeroclean.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.aeroclean.Helper1" send_interface="org.aeroclean.Helper1"/>
    <allow send_destination="org.aeroclean.Helper1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.aeroclean.Helper1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
