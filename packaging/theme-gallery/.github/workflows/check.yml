name: Check themes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Get AeroClean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R aizenprivai/aero-cleaner -p '*-x86_64.AppImage' -O aeroclean.AppImage
          chmod +x aeroclean.AppImage
      - name: Does this AeroClean know themes?
        id: support
        run: |
          if ./aeroclean.AppImage --appimage-extract-and-run theme list >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The latest AeroClean release has no theme support yet (it arrives in 2.1); themes weren't checked."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check every theme
        if: steps.support.outputs.ok == 'true'
        run: |
          status=0
          for f in themes/*.aerotheme; do
            ./aeroclean.AppImage --appimage-extract-and-run theme check "$f" || status=1
          done
          exit $status
      - name: Build the index
        if: steps.support.outputs.ok == 'true'
        run: ./aeroclean.AppImage --appimage-extract-and-run theme index themes > index.json
      - name: Publish the index
        if: steps.support.outputs.ok == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "AeroClean gallery"
          git config user.email "noreply@github.com"
          git add index.json
          git diff --cached --quiet || { git commit -m "Update the index"; git push; }
